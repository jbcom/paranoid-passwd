# -----------------------------------------------------------------
# paranoid-passwd -- Dependabot Configuration
#
# Automated dependency updates for GitHub Actions.
#
# Cargo crates are deliberately excluded from Dependabot PR automation because this
# repository replaces crates.io with the checked-in vendor/ tree. Dependabot's Cargo
# updater cannot maintain vendored Cargo sources, so Cargo dependency updates must
# be re-vendored by a maintainer and proven with locked/frozen/offline Cargo gates.
# -----------------------------------------------------------------

version: 2
updates:
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      sourcey-major:
        patterns: ["sourcey"]
        update-types: ["version-update:semver-major"]
      sourcey-non-major:
        patterns: ["sourcey"]
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "docs"
    labels:
      - "dependencies"
      - "documentation"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      actions-major:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]
      actions-non-major:
        patterns: ["*"]
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
